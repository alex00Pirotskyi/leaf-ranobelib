name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Generate missing Flutter Web scaffolding
        working-directory: flutter_app
        run: |
          flutter create --platforms=web --project-name=leaf_reader .
          flutter pub get

      - name: Test catalogue, discovery, imports and EPUB integrity
        working-directory: flutter_app
        run: flutter test

      - name: Validate bookmarklet JavaScript
        run: |
          node --check flutter_app/web/leaf-capture.js
          node scripts/capture-regression.cjs

      - name: Build Flutter Web
        working-directory: flutter_app
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          ACCOUNT_NAME: ${{ github.repository_owner }}
        run: |
          if [ "$REPOSITORY_NAME" = "$ACCOUNT_NAME.github.io" ]; then
            BASE_HREF="/"
          else
            BASE_HREF="/$REPOSITORY_NAME/"
          fi
          echo "Deploying at $BASE_HREF"
          flutter build web --release --base-href="$BASE_HREF"
          touch build/web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: flutter_app/build/web

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
